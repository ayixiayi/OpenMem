name: publish
permissions:
  contents: read

on:
  # Merging code is not authorization to publish packages.
  workflow_dispatch:

jobs:
  publish-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: install deps
        run: npm ci

      - name: verify
        run: |
          npx tsc --noEmit
          npm test

      - name: build
        run: npm run build

      - name: publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
