[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmemory-py"
version = "1.3.2"
description = "OpenMemory Python SDK"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "httpx",
    "python-dotenv",
    "PyYAML",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "notion-client>=2.0",
    "msal>=1.0",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.0",
    "pypdf>=4.0",
    "mammoth>=1.6",
    "markdownify>=0.11",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black"]
postgres = ["asyncpg>=0.29"]
valkey = ["redis>=5"]

[tool.pytest.ini_options]
markers = ["integration: requires explicitly enabled external services"]

[tool.hatch.build.targets.wheel]
packages = ["src/openmemory"]
